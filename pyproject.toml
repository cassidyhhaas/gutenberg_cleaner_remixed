[project]
name = "gutenberg-cleaner-remixed"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gutenberg_cleaner_remixed"]

[tool.hatch.build.targets.sdist]
# Ship the source tree needed to build and to run the test suite from a release,
# plus the documentation set.
include = ["src", "tests", "README.md", "LICENSE.md", "pyproject.toml"]


[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "N", "W"]

[tool.uv.sources]
gutenberg-cleaner-remixed = { workspace = true }
